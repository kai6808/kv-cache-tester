# =============================================================================
# sweep_rung1b_smoke.conf — Rung 1 Stage B smoke test (NOT for results).
#
# Proves the selective-offload plumbing end-to-end on a 5GB pool that is
# SMALLER than the ~6.4GB smoke working set, forcing the near-capacity
# admission branch and real CPU evictions:
#   JOINT:LRU_EQUIV:SEL  -> expect ZERO admission-refusal log lines
#   JOINT:SIZE_AWARE:SEL -> expect >=1 "offload admission refused" INFO line
# Deliberately isolated from a concurrently running Stage A sweep:
# GPU 1, port 8100, its own PROM_DIR and output tree.
# =============================================================================

# ---- SWEEP DIMENSIONS ---------------------------------------------------------
POLICIES=(JOINT:LRU_EQUIV:SEL JOINT:SIZE_AWARE:SEL)
CPU_SIZES_GB=(5)

# ---- OUTPUT -----------------------------------------------------------------
ENABLE_ACCESS_LOG=1
BASE_OUTPUT_DIR="/workspace/vllm/logs/rung1b_smoke"
RUN_PREFIX="smokeb"

# ---- SERVER (vllm serve) — fixed across the sweep ---------------------------
MODEL="Qwen/Qwen2.5-7B-Instruct"
HOST="localhost"
PORT="8100"
HIP_VISIBLE_DEVICES="1"
GPU_MEM_UTIL="0.5"
MAX_MODEL_LEN="131072"
MAX_NUM_SEQS="24"
BLOCK_SIZE="16"
KV_CACHE_METRICS_SAMPLE="1.0"
LMCACHE_CHUNK_SIZE="256"
PROM_DIR="/tmp/lmcache_prometheus_b"
HF_OVERRIDES='{"rope_parameters": {"rope_type": "yarn", "factor": 4.0, "original_max_position_embeddings": 32768, "rope_theta": 1000000}}'
KV_TRANSFER_CONFIG='{"kv_connector":"LMCacheConnectorV1","kv_role":"kv_both"}'

# ---- CLIENT (trace_replay_tester.py) — small on purpose ----------------------
TRACE_DIR="./traces"
TOKENIZER="Qwen/Qwen2.5-7B-Instruct"
MAX_CONTEXT="64000"
CHUNK_SIZE="64"
MAX_CONCURRENT="8"
START_USERS="10"
MAX_USERS="10"
MAX_TRACES="4"
TEST_DURATION="180"
MAX_REQUESTS="30"
TIMING_STRATEGY="think-only"
SEED="42"
MAX_TTFT="1000"

# ---- ORCHESTRATION TIMEOUTS / SAFETY (seconds) ------------------------------
SERVER_START_TIMEOUT="600"
SERVER_STOP_TIMEOUT="60"
SERVER_STOP_GRACE="30"
SERVER_SETTLE="15"
CLIENT_TIMEOUT_BUFFER="300"
POLL_INTERVAL="3"
