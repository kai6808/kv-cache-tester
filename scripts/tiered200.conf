# =============================================================================
# tiered200.conf — three-tier LRU L1 eviction vs LRU, 200-request fixed
# workload, under one DP router per invocation.
#
#   TIERED_ROUTER=sticky HIP_VISIBLE_DEVICES=2,3 ./scripts/run_coupled.sh scripts/tiered200.conf
#   TIERED_ROUTER=load   HIP_VISIBLE_DEVICES=2,3 ./scripts/run_coupled.sh scripts/tiered200.conf
#   python3 scripts/compare_fixed_workload.py 200 today_r1=<dir>/today_r1 ...
#
# tiered_lru = the COUPLED cost rule with survival off, which is exactly three
# LRU tiers evicted in order: GPU-covered, plain, queued-for (a chunk a request
# in some vLLM wait queue needs). Leaf-first keeps every cached prefix
# contiguous. Inside the GPU-covered tier the most recently used chunk goes
# first (--coupled-exclusive-order mru): vLLM frees its oldest blocks first
# and never writes them back, so the oldest GPU-covered chunks are about to be
# L1-only. "GPU-covered" is router-aware: any holder under sticky routing (a
# conversation only ever runs on its own rank), every rank under load-based
# routing (the next turn may land on either).
#
# Arms pair up by L1 fill behaviour:
#   today          LRU, stock eviction (80% watermark, 20% batches), no notices
#   today_od       LRU order (COUPLED, all weights 0) + on-demand, 97% / 2%,
#                  with residency + queue notices on (ignored at weight 0), so
#                  against tiered_lru_od only the eviction ORDER differs
#   tiered_lru     three-tier LRU, stock eviction
#   tiered_lru_od  three-tier LRU + on-demand, 97% / 2%
# Each runs twice, mirrored (ABCD DCBA) so slow drift cancels in the means.
#
# GPU_MEM_UTIL 0.4 (MI210): ~11.4 GB KV per GPU instead of 18.2 GB at 0.5, so
# more reuse falls through to L1. Watch vllm:num_preemptions_total.
# =============================================================================
source "$(dirname "${BASH_SOURCE[0]}")/coupled.conf"

ROUTER="${TIERED_ROUTER:-sticky}"
case "$ROUTER" in
  sticky) CLIENT_EXTRA_ARGS=(--dp-affinity 2); HOLDERS="any" ;;
  load)   CLIENT_EXTRA_ARGS=();                HOLDERS="all" ;;
  *) echo "ERROR: TIERED_ROUTER must be sticky or load, got '$ROUTER'" >&2; exit 1 ;;
esac

OD="--eviction-on-demand --eviction-trigger-watermark 0.97 --eviction-ratio 0.02"
LRU_ORDER="--coupled-w-queue 0 --coupled-w-survival 0 --coupled-w-exclusive 0 --coupled-gpu-residency-notice"
TIERED="--coupled-w-queue 4.0 --coupled-w-survival 0 --coupled-w-exclusive 0.5 --coupled-gpu-residency-notice --coupled-leaf-first --coupled-exclusive-order mru --coupled-exclusive-holders $HOLDERS"
ARMS=(
  "today_r1|LRU||0|0"
  "today_od_r1|COUPLED|$LRU_ORDER $OD|track|1"
  "tiered_lru_r1|COUPLED|$TIERED|track|1"
  "tiered_lru_od_r1|COUPLED|$TIERED $OD|track|1"
  "tiered_lru_od_r2|COUPLED|$TIERED $OD|track|1"
  "tiered_lru_r2|COUPLED|$TIERED|track|1"
  "today_od_r2|COUPLED|$LRU_ORDER $OD|track|1"
  "today_r2|LRU||0|0"
)

MAX_REQUESTS="200"
TEST_DURATION="3600"       # safety cap only; the request count ends the run
GPU_MEM_UTIL="0.4"
BASE_OUTPUT_DIR="/workspace/vllm/logs/$(date +%Y-%m-%d)_tiered200_${ROUTER}_$(date +%H%M%S)"

# 8000 is another user's vLLM on amd-01 (see od400.conf).
PORT="${TIERED_PORT:-8100}"

# Per-request cached tokens (GPU + L1 hits) in detailed_results.csv.
VLLM_EXTRA_ARGS=(--enable-prompt-tokens-details)
