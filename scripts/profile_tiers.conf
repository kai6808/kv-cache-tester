# =============================================================================
# profile_tiers.conf — config for scripts/profile_tiers.sh: a short, SINGLE-RUN
# GPU/CPU/SSD tier bandwidth+latency PROFILE (not a policy sweep) on the
# MP+DP=2 shared-pool path — same architecture as sweep_mp.conf/run_sweep_mp.sh
# (one `lmcache server` owning the shared CPU pool, one `vllm serve
# --data-parallel-size 2` in front of it), plus an SSD/L2 tier that
# sweep_mp.conf never turns on.
#
# Goal: warm traffic across all three tiers in one ~5-minute run, then
# compute bandwidth+latency per tier from files LMCache already writes to
# disk (no live-server scrape needed — see scripts/profile_tiers.sh's header
# for why: LMCache's real lmcache_mp_l0_l1_*/l2_*_throughput OTel histograms
# exist but aren't reachable over HTTP on this stack (upstream commit
# ed3fa706), and per your preference this conf/script don't patch lmcache
# source to fix that — compute_tier_metrics() derives the same numbers from
# LMCACHE_ACCESS_LOG + LMCACHE_LOG_LEVEL=DEBUG lines instead).
#
# ---- Attempt history (why the values below are what they are) ---------------
# 1. L1_SIZE_GB=20, trace_replay_tester.py, everything at "normal" settings:
#    real healthy traffic (118 L0->L1 stores, 16 loads) but L2 (SSD) never
#    touched — 7.8GB cumulative traffic never crossed the 16GB (0.8*20GB)
#    eviction watermark. Diagnosis: pool too big relative to traffic.
# 2. L1_SIZE_GB=5, GPU_MEM_UTIL=0.35, MAX_CONTEXT=16000, low concurrency:
#    total silence, worse. Two confirmed causes: GPU_MEM_UTIL=0.35 could
#    barely fit 1 max-length request/GPU (severe serialization, not a
#    crash), and MAX_CONTEXT=16000 would have starved trace_replay's trace
#    filter (keys on max tokens across the WHOLE conversation, not just the
#    first request). Reverted both.
# 3. L1_SIZE_GB=5, otherwise back to attempt 1's proven values: requests
#    got permanently STUCK in "prefilling" (0% progress for 3.5 minutes
#    straight, confirmed in client.log's Admission Control lines), while
#    mpserver.log's L1 memory usage stayed near 0.00 the whole time — a
#    reservation deadlock, not a slow degradation: pending reservations
#    for space in the small pool never complete (so nothing counts as
#    "used"), so eviction never sees pressure to free anything, so the
#    reservations can never complete either. This looks like a real
#    reliability edge case in the small-pool + concurrent-reservation path,
#    not something another guessed GB value was likely to fix reliably.
# 4. (this attempt) Switched the CLIENT from trace_replay_tester.py to
#    working_set_tester.py — kv-cache-tester's own tool built for exactly
#    this question — instead of shrinking the pool further. Two changes
#    that together sidestep attempt 3's hang instead of re-risking it:
#      - L1_SIZE_GB back to 20 (attempt 1's fully-proven, zero-hang-risk
#        value) — the pool itself is no longer the lever.
#      - The WORKING SET is made deterministically LARGER than the pool
#        instead (WST_MAX_WORKING_SET below, ~28GB > 20GB pool), so
#        eviction+reload is guaranteed by construction, not by hoping
#        organic trace-replay traffic happens to cross a watermark.
#    --mode fixed --fixed-concurrency (small, constant, no adaptive ramp)
#    plus a small WST_CONTEXT_SIZE per request keeps simultaneous-
#    reservation demand against the pool far below what attempt 3 hit
#    (small footprint x low fixed concurrency, vs. up to 64K-token x up to
#    16 concurrent there) — the two factors that plausibly drove the hang.
#
# NOTE on the SSD/L2 tier (still real, still only reasoned from source +
# these 4 runs, not a stress-tested path):
#   - LMCache's fs L2 adapter (v1/distributed/l2_adapters/fs_l2_adapter.py)
#     has NO built-in size cap. SSD_L2_MAX_GB below is a guideline for what
#     directory quota you keep SSD_L2_PATH under yourself — NOT enforced.
#   - L2 always rides on top of an L1 (CPU) pool by construction — there is
#     no CPU-off / disk-only mode on this path (mirrors the single-process
#     LocalDiskBackend's `assert local_cpu_backend is not None`).
# =============================================================================

# ---- TIERS (fixed, not swept — this is a single profiling run) --------------
# GPU: sized via GPU_MEM_UTIL/MAX_NUM_SEQS below to force some GPU eviction
# (L0->L1 traffic) instead of everything comfortably fitting in HBM.
# CPU (L1): back to attempt 1's proven-safe 20GB — see history above. The
# working set (below) is what's now sized to exceed this, not the pool.
L1_SIZE_GB="20"

# SSD (L2): EDIT ME if you move to a different machine. Confirmed local NVMe
# (not network storage) via `lsblk`/`df -h` on amd-01, 2026-09-09:
# /workspace/vllm sits on /dev/nvme0n1p2 (447G, ~49G free at last check).
# Directory is created (and wiped from any prior run) automatically.
SSD_L2_PATH="/workspace/vllm/lmcache_l2_ssd_profile"
SSD_L2_MAX_GB="40"             # guideline only, see NOTE above — not enforced by lmcache
L2_STORE_POLICY="default"      # store all keys to all L2 adapters, keep L1
L2_PREFETCH_POLICY="default"   # pick the first adapter by index when >1 L2 adapter

# ---- OUTPUT -----------------------------------------------------------------
BASE_OUTPUT_DIR="/workspace/vllm/logs/profile_tiers"
RUN_PREFIX=""

# ---- MP SERVER (`lmcache server`) — fixed ------------------------------------
MP_HOST="localhost"
MP_PORT="5556"                  # ZMQ port; offset from sweep_mp.conf's 5555 so
                                 # this can run alongside a real sweep if needed
MP_HTTP_HOST="0.0.0.0"
MP_HTTP_PORT="8081"             # /healthcheck, /status — offset from sweep_mp.conf's 8080
MP_LOG_LEVEL="DEBUG"            # needed for fs_l2_adapter.py's per-key byte-count lines (SSD bandwidth)
MP_MAX_WORKERS="4"
MP_CHUNK_SIZE="256"
MP_MQ_TIMEOUT="10"              # seconds, vLLM-side lmcache.mp.mq_timeout
# TTLs disabled (very large, ~10y) so nothing evicts by age mid-profile.
MP_L1_WRITE_TTL_SECONDS="315360000"
MP_L1_READ_TTL_SECONDS="315360000"
EVICTION_POLICY="LRU"           # MP path only supports LRU / IsolatedLRU / noop

# ---- SERVER (vllm serve) — fixed ---------------------------------------------
MODEL="Qwen/Qwen2.5-7B-Instruct"
HOST="localhost"
PORT="8001"                     # offset from sweep_mp.conf's 8000
DATA_PARALLEL_SIZE="2"          # you have up to 4 GPUs available; bump this + HIP_VISIBLE_DEVICES to "0,1,2,3" if traffic still isn't enough
HIP_VISIBLE_DEVICES="0,1"       # must list DATA_PARALLEL_SIZE GPUs
GPU_MEM_UTIL="0.5"              # proven-safe (see history above) — real, healthy GPU eviction traffic at this value. Don't drop this without checking "Maximum concurrency for <N> tokens per request" in .server.log first.
MAX_MODEL_LEN="131072"
MAX_NUM_SEQS="24"
BLOCK_SIZE="16"
KV_CACHE_METRICS_SAMPLE="1.0"
HF_OVERRIDES='{"rope_parameters": {"rope_type": "yarn", "factor": 4.0, "original_max_position_embeddings": 32768, "rope_theta": 1000000}}'
KV_LOAD_FAILURE_POLICY="recompute"
PROM_DIR="/tmp/lmcache_prometheus_profile_tiers"   # vLLM's own KV-cache-metrics multiproc dir — unrelated to the lmcache-server metrics gap noted above

# ---- CLIENT (working_set_tester.py) ------------------------------------------
# Deterministically cycles requests through a working set of tokens, growing
# from WST_MIN_WORKING_SET to WST_MAX_WORKING_SET over the course of the
# single TEST_DURATION-length run (both "fixed" and "sustained" mode only
# ever test the max size; growth to it happens via scheduled events inside
# that one run — see working_set_tester.py's main loop). At
# WST_CACHE_HIT_RATE=100, every request is pulled verbatim from the working
# set (round-robin) — genuine, guaranteed repeated access, unlike trace
# replay's organic conversation pattern.
TOKENIZER="Qwen/Qwen2.5-7B-Instruct"
CHUNK_SIZE="256"                 # matches MP_CHUNK_SIZE above — client's rounding assumption should match the server's real chunk size
SEED="42"

# Per-request context size: kept modest on purpose (small simultaneous-
# reservation footprint against the CPU pool, unlike attempt 3's up-to-64K).
WST_CONTEXT_SIZE="8000"

# Working set range, in TOKENS (not GB). At ~56KB/token (rung0_mp_m3: 17.8GB
# / 318,016 tokens): min ~40,000 tokens (~2.2GB) starts comfortably inside
# the 20GB pool; max ~500,000 tokens (~28GB) deliberately exceeds it by
# ~40%, guaranteeing eviction + reload by construction, not by hoping.
WST_MIN_WORKING_SET="40000"
WST_MAX_WORKING_SET="500000"
WST_INCREMENTS="5"              # number of growth checkpoints across the run

WST_CACHE_HIT_RATE="100"        # always pull from the working set (see above)

# Small, FIXED, constant concurrency — no adaptive ramp-up. This is the
# other half of sidestepping attempt 3's hang (see history above): low
# simultaneous demand against the pool, deliberately.
WST_FIXED_CONCURRENCY="4"
WST_INIT_CONCURRENCY="4"        # concurrency used only for the initial pre-warm of WST_MIN_WORKING_SET, before the timed run starts

WST_ASSESSMENT_PERIOD="30"      # seconds between progress log lines

# Short on purpose: decode length doesn't add tier traffic but does dominate
# wall-clock/request. Default (256) paces ~9s/request at c=4 -> only ~30-35
# requests land in 300s, right around when the watermark would first trip,
# with no time left for the working set to rotate back to evicted content.
# At 32, ~3s/request -> ~1.2 req/s -> watermark crossed with ~1.5-2 full
# post-eviction rotations still inside the run. See profile_tiers.sh's
# run_client() comment for why --force-restart is unconditional (not a
# toggle here): a same-name rerun would otherwise be silently skipped by
# working_set_tester.py's own progress.json, not something to opt out of.
WST_OUTPUT_TOKENS="32"

TEST_DURATION="300"             # 5 min total — covers the whole min->max growth sweep in one run, not per-step

# ---- ORCHESTRATION TIMEOUTS / SAFETY (seconds) -------------------------------
MP_SERVER_START_TIMEOUT="60"
MP_SERVER_STOP_TIMEOUT="30"
MP_SERVER_STOP_GRACE="15"
SERVER_START_TIMEOUT="600"
SERVER_STOP_TIMEOUT="60"
SERVER_STOP_GRACE="30"
CLIENT_TIMEOUT_BUFFER="600"
POLL_INTERVAL="3"
