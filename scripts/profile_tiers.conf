# =============================================================================
# profile_tiers.conf — config for scripts/profile_tiers.sh: a short, SINGLE-RUN
# GPU/CPU/SSD tier bandwidth+latency PROFILE (not a policy sweep) on the
# MP+DP=2 shared-pool path — same architecture as sweep_mp.conf/run_sweep_mp.sh
# (one `lmcache server` owning the shared CPU pool, one `vllm serve
# --data-parallel-size 2` in front of it), plus an SSD/L2 tier that
# sweep_mp.conf never turns on.
#
# Goal: warm traffic across all three tiers in one short run, then compute
# bandwidth+latency per tier from files LMCache already writes to disk.
#
# UPDATE 2026-09-09, after the first real run: LMCache's `lmcache server`
# DOES compute proper OTel throughput histograms in GB/s
# (lmcache_mp_l0_l1_*_throughput for GPU<->CPU, lmcache_mp_l2_*_throughput
# for CPU<->SSD) — but upstream commit ed3fa706 hardcodes
# start_prometheus_http_server=False for this entrypoint and nothing else
# mounts a /metrics route for it, so those histograms are UNREACHABLE over
# HTTP on this stack. The fix is a one-line source patch to the lmcache
# fork; per your preference to only touch .sh/.conf here, we're not doing
# that. Instead scripts/profile_tiers.sh now derives the same two numbers
# itself, no source changes: GPU<->CPU per-transfer latency+bandwidth from
# the LMCACHE_ACCESS_LOG JSONL (real per-event numbers), and CPU<->SSD
# AVERAGE bandwidth from LMCACHE_LOG_LEVEL=DEBUG byte-count log lines (no
# per-transfer latency available this way — see the script's header and
# compute_tier_metrics() for the exact caveat). Both are therefore ON here
# now (they weren't in the original version of this conf).
#
# This is deliberately still NOT sweep_mp.conf: no policy x cpu_size matrix,
# short TEST_DURATION/MAX_REQUESTS, and the access log gets deleted along
# with everything else under BASE_OUTPUT_DIR whenever you clean up old
# profiling runs — it's small (one short run) but it's not meant to be kept
# as a long-term trace the way a real sweep's is.
#
# NOTE on the SSD/L2 tier (untested on this stack before now — verified by
# reading the fork's source, not by running it):
#   - LMCache's fs L2 adapter (v1/distributed/l2_adapters/fs_l2_adapter.py)
#     has NO built-in size cap. SSD_L2_MAX_GB below is a guideline for what
#     directory quota you keep SSD_L2_PATH under yourself — NOT an enforced
#     limit. A 5-minute profiling run (even uncapped MAX_REQUESTS, bounded
#     only by TEST_DURATION) writes far less than that; this only matters
#     if you crank TEST_DURATION up a lot later.
#   - L2 always rides on top of an L1 (CPU) pool by construction — there is
#     no CPU-off / disk-only mode on this path (mirrors the single-process
#     LocalDiskBackend's `assert local_cpu_backend is not None`).
# =============================================================================

# ---- TIERS (fixed, not swept — this is a single profiling run) --------------
# GPU: sized via GPU_MEM_UTIL/MAX_NUM_SEQS below to force some GPU eviction
# (L0->L1 traffic) instead of everything comfortably fitting in HBM.
#
# CPU (L1): history, two failed attempts before this one, both real runs:
#   - Attempt 1 (L1_SIZE_GB=20, everything else as attempt 3 below): 7.795 GB
#     cumulative store traffic never crossed the 16GB (0.8 * 20GB) eviction
#     watermark -> zero L2 loads. "default" L2_STORE_POLICY write-throughs
#     every L1 write to L2 immediately (confirmed: L1 store total == L2
#     store total, 7.795 GB both) -- so data WAS on the SSD, just never
#     evicted from L1, so nothing needed reading back. This attempt's fix:
#     shrink L1_SIZE_GB well below that ~7.8GB observed working set.
#   - Attempt 2 (L1_SIZE_GB=5, GPU_MEM_UTIL=0.35, MAX_CONTEXT=16000,
#     MAX_CONCURRENT/USERS=4/2/4): total silence on EVERY tier, worse than
#     attempt 1. Root cause A (confirmed from .server.log, not guessed):
#     "GPU KV cache size: 138,304 tokens" / "Maximum concurrency for
#     131,072 tokens per request: 1.06x" -- GPU_MEM_UTIL=0.35 could barely
#     fit ONE max-length request per GPU at a time, so 16 concurrent users
#     serialized to a crawl (13 requests completed in 300s, all "0 prefix
#     hits"; no crash confirmed in .server.log -- the client-log EngineCore
#     "Request failed" lines at the very end were SIGINT-at-timeout
#     artifacts, not an engine crash). Root cause B (caught before running,
#     via trace_replay_tester.py's TraceManager.load_traces): the trace
#     filter keys on max(input_tokens) across the WHOLE conversation, not
#     just the first request -- MAX_CONTEXT=16000 would have silently
#     starved the trace pool too (median *ending* input is 137,529 tokens,
#     so traces only grow past 16K), compounding A. Both changes in this
#     attempt were wrong simultaneously; no way to tell which mattered more.
# This attempt (3) reverts to run 1's PROVEN values for everything except
# L1_SIZE_GB: GPU_MEM_UTIL back to 0.5 (produced real 118-store/16-load
# traffic in attempt 1), MAX_CONTEXT/MAX_CONCURRENT/START_USERS/MAX_USERS
# back to 64000/16/8/16 (same values, same healthy trace pool). Only
# L1_SIZE_GB changes, from attempt 1's number (20) straight to the fix
# attempt 1's own data already justified: well under the ~7.8GB working
# set, while still >= one max-length request's ~3.5GB footprint (56KB/token
# from rung0_mp_m3: 17.8GB / 318,016 tokens) so a single retrieve can't
# itself overflow the pool.
L1_SIZE_GB="5"

# SSD (L2): EDIT ME if you move to a different machine. Confirmed local NVMe
# (not network storage) via `lsblk`/`df -h` on amd-01, 2026-09-09:
# /workspace/vllm sits on /dev/nvme0n1p2 (447G, ~49G free at last check).
# Directory is created on first run if missing.
SSD_L2_PATH="/workspace/vllm/lmcache_l2_ssd_profile"
SSD_L2_MAX_GB="40"             # guideline only, see NOTE above — not enforced by lmcache
L2_STORE_POLICY="default"      # store all keys to all L2 adapters, keep L1
L2_PREFETCH_POLICY="default"   # pick the first adapter by index when >1 L2 adapter

# ---- OUTPUT -----------------------------------------------------------------
BASE_OUTPUT_DIR="/workspace/vllm/logs/profile_tiers"
RUN_PREFIX=""

# ---- MP SERVER (`lmcache server`) — fixed ------------------------------------
MP_HOST="localhost"
MP_PORT="5556"                  # ZMQ port; offset from sweep_mp.conf's 5555 so
                                 # this can run alongside a real sweep if needed
MP_HTTP_HOST="0.0.0.0"
MP_HTTP_PORT="8081"             # /healthcheck, /status — offset from sweep_mp.conf's 8080
MP_LOG_LEVEL="DEBUG"            # needed for fs_l2_adapter.py's per-key byte-count lines (SSD bandwidth)
MP_MAX_WORKERS="4"
MP_CHUNK_SIZE="256"
MP_MQ_TIMEOUT="10"              # seconds, vLLM-side lmcache.mp.mq_timeout
# TTLs disabled (very large, ~10y) so nothing evicts by age mid-profile.
MP_L1_WRITE_TTL_SECONDS="315360000"
MP_L1_READ_TTL_SECONDS="315360000"
EVICTION_POLICY="LRU"           # MP path only supports LRU / IsolatedLRU / noop

# ---- SERVER (vllm serve) — fixed ---------------------------------------------
MODEL="Qwen/Qwen2.5-7B-Instruct"
HOST="localhost"
PORT="8001"                     # offset from sweep_mp.conf's 8000
DATA_PARALLEL_SIZE="2"          # you have up to 4 GPUs available; bump this + HIP_VISIBLE_DEVICES to "0,1,2,3" if 2 workers' GPU-eviction traffic still isn't enough
HIP_VISIBLE_DEVICES="0,1"       # must list DATA_PARALLEL_SIZE GPUs
GPU_MEM_UTIL="0.5"              # back to 0.5 (2026-09-09): 0.35 caused the GPU-side stall documented above -- 0.5 is the value that produced real, healthy L0<->L1 traffic (118 stores/16 loads) in the very first run. Not touching this again; MAX_CONTEXT below is the lever now.
MAX_MODEL_LEN="131072"
MAX_NUM_SEQS="24"
BLOCK_SIZE="16"
KV_CACHE_METRICS_SAMPLE="1.0"
HF_OVERRIDES='{"rope_parameters": {"rope_type": "yarn", "factor": 4.0, "original_max_position_embeddings": 32768, "rope_theta": 1000000}}'
KV_LOAD_FAILURE_POLICY="recompute"
PROM_DIR="/tmp/lmcache_prometheus_profile_tiers"   # vLLM's own KV-cache-metrics multiproc dir — unrelated to the lmcache-server metrics gap noted above

# ---- CLIENT (trace_replay_tester.py) — short, just enough to touch all 3 tiers
TRACE_DIR="./traces"
TOKENIZER="Qwen/Qwen2.5-7B-Instruct"
# Back to 64000/16/8/16 (2026-09-09, see L1 note above): the values attempt
# 2 changed these to (16000/4/2/4) turned out to be actively harmful, not
# just unproven -- 16000 would have starved TraceManager's trace filter
# (which keys on max input_tokens across the whole conversation) almost
# entirely, on top of the GPU-concurrency stall. These are back to exactly
# attempt 1's values, which are proven: real, healthy traffic (118 L0->L1
# stores, 16 L1->L0 loads) with plenty of traces to draw from.
MAX_CONTEXT="64000"
CHUNK_SIZE="64"
MAX_CONCURRENT="16"
START_USERS="8"
MAX_USERS="16"
MAX_TRACES="8"
TEST_DURATION="300"             # 5 min — profiling probe, not a full sweep run
# Empty (was "100"): the first run's L1<->L2 DEBUG-line window was only
# 147.3s of the 300s budget -- MAX_REQUESTS=100 was hit early and traffic
# stopped, wasting the back half of the window that could've re-requested
# now-evicted content. Uncapped, TEST_DURATION alone bounds the run.
MAX_REQUESTS=""
TIMING_STRATEGY="think-only"
SEED="42"
MAX_TTFT="1000"

# ---- ORCHESTRATION TIMEOUTS / SAFETY (seconds) -------------------------------
MP_SERVER_START_TIMEOUT="60"
MP_SERVER_STOP_TIMEOUT="30"
MP_SERVER_STOP_GRACE="15"
SERVER_START_TIMEOUT="600"
SERVER_STOP_TIMEOUT="60"
SERVER_STOP_GRACE="30"
CLIENT_TIMEOUT_BUFFER="600"
POLL_INTERVAL="3"
