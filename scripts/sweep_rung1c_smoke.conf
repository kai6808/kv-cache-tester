# =============================================================================
# sweep_rung1c_smoke.conf — Stage C smoke: isolated from any main-GPU sweep
# (GPU 1, port 8100, own PROM_DIR/output tree). Small pool (5GB) + few traces
# so eviction paths fire fast. Two combos:
#   JOINT:LRU_EQUIV                      off-state sanity (no GPU shim active;
#                                        LMCACHE_JOINT_GPU_EVICT unset)
#   JOINT:SIZE_AWARE:SEL:GPU=CPU_BACKED  all three decisions on
# Pass criteria (plan Task C6): 2/2 client OK; the :GPU run's server log shows
# joint_gpu_preset in the engine config and gpu_evict counters moving; zero
# error/traceback lines; GPUs idle after.
# =============================================================================

# ---- SWEEP DIMENSIONS ---------------------------------------------------------
POLICIES=(JOINT:LRU_EQUIV JOINT:SIZE_AWARE:SEL:GPU=CPU_BACKED)
CPU_SIZES_GB=(5)

# ---- OUTPUT -----------------------------------------------------------------
ENABLE_ACCESS_LOG=1
BASE_OUTPUT_DIR="/workspace/vllm/logs/rung1c_smoke"
RUN_PREFIX=""

# ---- SERVER (vllm serve) — fixed across the sweep ---------------------------
MODEL="Qwen/Qwen2.5-7B-Instruct"
HOST="localhost"
PORT="8100"
HIP_VISIBLE_DEVICES="1"
GPU_MEM_UTIL="0.5"
MAX_MODEL_LEN="131072"
MAX_NUM_SEQS="24"
BLOCK_SIZE="16"
KV_CACHE_METRICS_SAMPLE="1.0"
LMCACHE_CHUNK_SIZE="256"
PROM_DIR="/tmp/lmcache_prometheus_rung1c_smoke"
HF_OVERRIDES='{"rope_parameters": {"rope_type": "yarn", "factor": 4.0, "original_max_position_embeddings": 32768, "rope_theta": 1000000}}'
KV_TRANSFER_CONFIG='{"kv_connector":"LMCacheConnectorV1","kv_role":"kv_both"}'

# ---- CLIENT (trace_replay_tester.py) — small, fast ---------------------------
TRACE_DIR="./traces"
TOKENIZER="Qwen/Qwen2.5-7B-Instruct"
MAX_CONTEXT="64000"
CHUNK_SIZE="64"
MAX_CONCURRENT="8"
START_USERS="8"
MAX_USERS="12"
MAX_TRACES="4"
TEST_DURATION="600"
MAX_REQUESTS="20"
TIMING_STRATEGY="think-only"
SEED="42"
MAX_TTFT="1000"

# ---- ORCHESTRATION TIMEOUTS / SAFETY (seconds) ------------------------------
SERVER_START_TIMEOUT="600"
SERVER_STOP_TIMEOUT="60"
SERVER_STOP_GRACE="30"
SERVER_SETTLE="20"
CLIENT_TIMEOUT_BUFFER="900"
POLL_INTERVAL="3"
