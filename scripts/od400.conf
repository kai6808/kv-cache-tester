# =============================================================================
# od400.conf — fixed-workload comparison of on-demand L1 eviction and the
# prefix-aware (leaf-first) coupled cost rule, load-based DP routing.
#
#   HIP_VISIBLE_DEVICES=2,3 ./scripts/run_coupled.sh scripts/od400.conf
#   python3 scripts/compare_fixed_workload.py 400 today=<dir>/today ...
#
# Why fixed work: a fixed wall clock lets slower arms process less, which
# shrinks their hit-rate denominator (round 1's "higher hit rate" artifact).
# MAX_REQUESTS=400 with seed 42 is the agentic_jul5_req400 method.
#
# Arms (all load-based DP routing; sticky routing leaves L1 unused early):
#   today            LRU, stock eviction (80% watermark, 20% batches)
#   today_od         LRU order + on-demand L1 eviction. COUPLED with every
#                    weight 0 == exact LRU order; run_coupled.sh only passes
#                    extra lmcache flags to COUPLED arms.
#   cpu_only_leaf_od cost rule + leaf-first + on-demand; GPU stock LRU
#                    (residency tracked for the exclusive term)
#   coupled_leaf_od  cost rule + leaf-first + on-demand + GPU leaf-only
#                    backed-first
# On-demand arms keep the watermark loop as a light housekeeper (97% / 2%).
# =============================================================================
source "$(dirname "${BASH_SOURCE[0]}")/coupled.conf"

OD="--eviction-on-demand --eviction-trigger-watermark 0.97 --eviction-ratio 0.02"
COST="--coupled-w-queue 4.0 --coupled-w-survival 1.0 --coupled-w-exclusive 0.5 --coupled-gpu-residency-notice --coupled-leaf-first"
ARMS=(
  "today|LRU||0|0"
  "today_od|COUPLED|--coupled-w-queue 0 --coupled-w-survival 0 --coupled-w-exclusive 0 $OD|0|0"
  "cpu_only_leaf_od|COUPLED|$COST $OD|track|1"
  "coupled_leaf_od|COUPLED|$COST $OD|1|1"
)

MAX_REQUESTS="400"
TEST_DURATION="3600"       # safety cap only; the request count ends the run
BASE_OUTPUT_DIR="/workspace/vllm/logs/$(date +%Y-%m-%d)_od400_$(date +%H%M%S)"

# 8000 was taken by another user's vLLM (host networking) on 2026-09-23;
# coupled.conf sets PORT=8000, so a plain ${PORT:-...} default would not apply.
PORT="${OD400_PORT:-8100}"   # override: OD400_PORT=8000 ./scripts/run_coupled.sh ...

# Per-request cached tokens (GPU + L1 hits) in detailed_results.csv, and the
# GPU-side leaf-only mode (inert unless an arm turns backed-first on).
VLLM_EXTRA_ARGS=(--enable-prompt-tokens-details)
VLLM_BASE_ENV=("LMCACHE_GPU_EVICT_L1_BACKED_LEAF=1")
