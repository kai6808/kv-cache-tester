# =============================================================================
# coupled.conf — coupled GPU + L1 eviction, real round.
#
# Sourced by scripts/run_coupled.sh, which runs one ARM at a time through
# scripts/run_sweep_mp.sh (same tested orchestration as the DP2 collection).
#
# Validates, on real hardware, the design measured offline in cachelab's
# sim/residency (results 2026-09-21): a three-term L1 cost rule plus two
# cross-tier couplings. Section 6 found NEITHER coupling is worth deploying
# alone, which is why the ladder below separates them.
# =============================================================================

# ---- ARMS -------------------------------------------------------------------
# One run each, in order. Fields, pipe-separated:
#
#   name | eviction-policy | extra `lmcache server` flags | gpu_side | demand
#
#   gpu_side = 0      nothing on the vLLM side
#              track  report GPU chunk residency (the exclusive term's input)
#                     without changing vLLM's allocation order
#              1      track + "GPU evicts L1-backed first"
#   demand   = 1 sends queue-demand + residency notices to the server
#
# Every weight at 0.0 makes COUPLED evict in exactly LRU order, so the ladder
# is configuration-only -- no code differs between arms.
#
# Drop or reorder lines to change the comparison; nothing else needs editing.
# Round 1 (decided 2026-09-22): today vs the full coupled design.
ARMS=(
  "today|LRU||0|0"
  "coupled|COUPLED|--coupled-w-queue 4.0 --coupled-w-survival 1.0 --coupled-w-exclusive 0.5 --coupled-gpu-residency-notice|1|1"
)
# Round 2, after round 1 is reviewed: add these two lines to ARMS above to
# attribute the gain between the L1 cost rule and the GPU-side coupling.
#  "l1_cost|COUPLED|--coupled-w-queue 4.0 --coupled-w-survival 1.0 --coupled-w-exclusive 0.0|0|1"
#  "gpu_demote|COUPLED|--coupled-w-queue 4.0 --coupled-w-survival 1.0 --coupled-w-exclusive 0.0|1|1"

# ---- COST RULE --------------------------------------------------------------
# Defaults come from sim/residency/config.py. The terms are deliberately NOT
# normalized against each other: `queued` is a flat +4.0 while P_reuse is a raw
# value in [0,1], so any queued chunk outranks any non-queued one. That
# asymmetry is the policy; rescaling would break comparability with the replay.
#
# NOTE: these weights were tuned against SIMULATED miss time with no TTFT
# model. They may need retuning against real TTFT -- that is a result, not a
# bug. Edit the ARMS lines above to sweep them.
COUPLED_SURVIVAL_HORIZON_S="300"     # H, the reuse horizon
COUPLED_TIE_BREAK="lru"              # order among equal-score chunks

# ---- GPU SIDE ---------------------------------------------------------------
# Selection window for "GPU evicts L1-backed first": BlockPool scans
# num_blocks + window entries from the free-list head. A window that never
# contains an L1-backed block degrades silently to plain LRU order.
GPU_EVICT_WINDOW="256"

# ---- OUTPUT -----------------------------------------------------------------
# A fresh, timestamped directory per invocation: never reuse a previous run's
# path. (The rung0_m2_smoke config reuses a fixed path and overwrites in place.)
# Named by the run's date (user decision 2026-09-23); the time suffix keeps
# every invocation's directory fresh. --smoke appends _smoke.
BASE_OUTPUT_DIR="/workspace/vllm/logs/$(date +%Y-%m-%d)_coupled_round1_$(date +%H%M%S)"
RUN_PREFIX=""

# ---- EXTRA ENV --------------------------------------------------------------
# Extra KEY=VAL env for vLLM (VLLM_BASE_ENV) or the lmcache server
# (MP_BASE_ENV) in every arm. Empty: nothing is needed since lmcache 5031626e.
# (HIP_ENABLE_DEFERRED_LOADING=0 was tried against a suspected lazy-kernel-load
# stall; it segfaults `import torch` on this ROCm 7.2 / torch 2.10 build, and
# the stall turned out to be something else -- see WARM-UP below.)
VLLM_BASE_ENV=()
MP_BASE_ENV=()

# ---- WARM-UP ----------------------------------------------------------------
# 16 distinct random-word prompts (never shared with the traces); wait until
# ALL return, then clear L1 so every arm starts the measured run from an empty
# pool with the same seed and traces. Before lmcache 5031626e the first stores
# of a fresh server pair hung for ~150 s (sometimes for ever): the worker and
# the MP server destroyed their handles of the same interprocess GPU event at
# once, and on ROCm both destroys block (cachelab design doc section 11). The
# fix keeps those events alive; with it the warm-up takes ~3 s. It stays as a
# cheap sanity check: the smoke fails if it does not complete.
WARMUP_PROMPTS="16"
WARMUP_TOKENS="1024"
WARMUP_TIMEOUT="600"

# Per-event JSONL tracing. OFF for real rounds: the counters and per-run
# summaries are all the comparison needs, and a traced run writes ~13.7k events
# per few minutes. Turn on only to debug the mechanism.
ENABLE_ACCESS_LOG=0

# ---- MP SERVER (shared L1 pool) ---------------------------------------------
MP_HOST="localhost"
MP_PORT="5555"
MP_HTTP_HOST="0.0.0.0"
MP_HTTP_PORT="8080"
MP_MAX_WORKERS="4"
MP_CHUNK_SIZE="256"                  # 256/BLOCK_SIZE = 16 blocks per chunk
MP_MQ_TIMEOUT="10"
MP_L1_WRITE_TTL_SECONDS="315360000"
MP_L1_READ_TTL_SECONDS="315360000"

# L1 pool size. DP2 at 20GB only for this round: the offline replay already
# showed the gain, so this is a confirmation on real hardware, not a sweep.
CPU_SIZES_GB=(20)

# ---- VLLM SERVER ------------------------------------------------------------
MODEL="Qwen/Qwen2.5-7B-Instruct"
HOST="localhost"
PORT="8000"
DATA_PARALLEL_SIZE="2"
# Must list DATA_PARALLEL_SIZE GPUs. Overridable from the environment because
# amd-01 is shared: check `rocm-smi --showmemuse` and pick GPUs whose VRAM is
# at 0% before starting, or the run will contend with someone else's job.
#   HIP_VISIBLE_DEVICES=2,3 ./scripts/run_coupled.sh
HIP_VISIBLE_DEVICES="${HIP_VISIBLE_DEVICES:-0,1}"
GPU_MEM_UTIL="0.5"
MAX_MODEL_LEN="131072"
MAX_NUM_SEQS="24"
BLOCK_SIZE="16"
KV_CACHE_METRICS_SAMPLE="1.0"
HF_OVERRIDES='{"rope_parameters": {"rope_type": "yarn", "factor": 4.0, "original_max_position_embeddings": 32768, "rope_theta": 1000000}}'
KV_LOAD_FAILURE_POLICY="recompute"
PROM_DIR="/tmp/lmcache_prometheus_coupled"

# ---- CLIENT -----------------------------------------------------------------
TRACE_DIR="./traces"
TOKENIZER="Qwen/Qwen2.5-7B-Instruct"
MAX_CONTEXT="64000"
CHUNK_SIZE="64"
MAX_CONCURRENT="24"
START_USERS="30"
MAX_USERS="50"
MAX_TRACES="64"

# Stop rule: fixed wall-clock per arm, with a high request cap as a safety net.
# Every arm sees the same 30-minute load pattern; a better policy serves MORE
# requests, which becomes the throughput result rather than a confound.
TEST_DURATION="1800"
MAX_REQUESTS=""
TIMING_STRATEGY="think-only"
SEED="42"
MAX_TTFT="1000"

# ---- ORCHESTRATION TIMEOUTS / SAFETY (seconds) ------------------------------
MP_SERVER_START_TIMEOUT="60"
MP_SERVER_STOP_TIMEOUT="30"
MP_SERVER_STOP_GRACE="15"
SERVER_START_TIMEOUT="600"
SERVER_STOP_TIMEOUT="60"
SERVER_STOP_GRACE="30"
SERVER_SETTLE="20"
CLIENT_TIMEOUT_BUFFER="900"
POLL_INTERVAL="3"
