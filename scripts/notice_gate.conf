# =============================================================================
# notice_gate.conf — overhead gate for the coupled eviction's notice path.
#
#   HIP_VISIBLE_DEVICES=0,1 ./scripts/run_coupled.sh scripts/notice_gate.conf
#
# Two arms that evict in IDENTICAL order (COUPLED with every weight at 0 is
# byte-identical to LRU) and allocate identically on the GPU ("track" reports
# residency without reordering reclaim). The only difference is whether the
# queue-demand and residency notices are sent and handled -- so any TTFT or
# throughput gap between them is the notice path's own cost.
#
# Pass (cachelab decision 2026-09-22): TTFT p50 and output tok/s within +-5 %,
# no stalls or engine deaths after warm-up, server handler p99 < 1 ms, and
# notices actually flowed in the "on" arm. The summary exits non-zero on FAIL.
# =============================================================================

source "$(dirname "${BASH_SOURCE[0]}")/coupled.conf"

ARMS=(
  "gate_off|COUPLED|--coupled-w-queue 0 --coupled-w-survival 0 --coupled-w-exclusive 0|0|0"
  "gate_on|COUPLED|--coupled-w-queue 0 --coupled-w-survival 0 --coupled-w-exclusive 0 --coupled-gpu-residency-notice|track|1"
)
CPU_SIZES_GB=(20)
TEST_DURATION="600"
BASE_OUTPUT_DIR="/workspace/vllm/logs/notice_gate_$(date +%Y%m%d_%H%M%S)"
SUMMARY_ARGS=(--gate)
