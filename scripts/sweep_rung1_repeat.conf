# =============================================================================
# sweep_rung1_repeat.conf — Rung 1 Stage A variance repeats.
#
# Re-runs combos (a) LRU and (g) JOINT:ADAPTIVE once each at both pool sizes
# (plan Part 4 Step 3: "repeat (a) and (g) once each to bound single-run
# variance before claiming any difference"). RUN_PREFIX=rep2 keeps run names
# from colliding with the main sweep's; everything else is byte-identical to
# sweep_rung1.conf.
# =============================================================================

# ---- SWEEP DIMENSIONS ---------------------------------------------------------
POLICIES=(LRU JOINT:ADAPTIVE)
CPU_SIZES_GB=(20 30)

# ---- OUTPUT -----------------------------------------------------------------
ENABLE_ACCESS_LOG=1
BASE_OUTPUT_DIR="/workspace/vllm/logs/rung1_stageA"
RUN_PREFIX="rep2"

# ---- SERVER (vllm serve) — fixed across the sweep ---------------------------
MODEL="Qwen/Qwen2.5-7B-Instruct"
HOST="localhost"
PORT="8000"
HIP_VISIBLE_DEVICES="0"
GPU_MEM_UTIL="0.5"
MAX_MODEL_LEN="131072"
MAX_NUM_SEQS="24"
BLOCK_SIZE="16"
KV_CACHE_METRICS_SAMPLE="1.0"
LMCACHE_CHUNK_SIZE="256"
PROM_DIR="/tmp/lmcache_prometheus"
HF_OVERRIDES='{"rope_parameters": {"rope_type": "yarn", "factor": 4.0, "original_max_position_embeddings": 32768, "rope_theta": 1000000}}'
KV_TRANSFER_CONFIG='{"kv_connector":"LMCacheConnectorV1","kv_role":"kv_both"}'

# ---- CLIENT (trace_replay_tester.py) — fixed across the sweep ---------------
TRACE_DIR="./traces"
TOKENIZER="Qwen/Qwen2.5-7B-Instruct"
MAX_CONTEXT="64000"
CHUNK_SIZE="64"
MAX_CONCURRENT="24"
START_USERS="30"
MAX_USERS="50"
MAX_TRACES="64"
TEST_DURATION="3600"
MAX_REQUESTS="400"
TIMING_STRATEGY="think-only"
SEED="42"
MAX_TTFT="1000"

# ---- ORCHESTRATION TIMEOUTS / SAFETY (seconds) ------------------------------
SERVER_START_TIMEOUT="600"
SERVER_STOP_TIMEOUT="60"
SERVER_STOP_GRACE="30"
SERVER_SETTLE="20"
CLIENT_TIMEOUT_BUFFER="1800"
POLL_INTERVAL="3"
