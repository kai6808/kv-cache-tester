# =============================================================================
# sweep_rung1c.conf — Rung 1 Stage C: the offload-eviction-controller sweep.
# ONE conf sweeping all three joint decisions (CPU eviction / selective
# offload / GPU eviction) in an attribution-clean ladder, 6 combos x {20,30}GB
# = 12 runs.
#
# Combos (see .claude/plans/2026-07-19-rung1-stage-c-gpu-eviction.md):
#   LRU                                  baseline — everything stock
#   JOINT:SIZE_AWARE                     CPU eviction only
#   JOINT:SIZE_AWARE:SEL                 CPU eviction + selective offload
#   JOINT:SIZE_AWARE:GPU=CPU_BACKED      CPU eviction + GPU eviction
#   JOINT:SIZE_AWARE:SEL:GPU=CPU_BACKED  all three decisions
#   JOINT:ADAPTIVE:SEL:GPU=CPU_BACKED    all three + closed-loop CPU rule
#
# NOTE: SIZE_AWARE is a PROVISIONAL preset choice — revisit after the Stage
# A+B sweep (sweep_rung1.conf) results are analyzed, and swap the ladder's
# preset if a different operating point wins.
#
# run_sweep.sh splits the combo string: LMCACHE_CACHE_POLICY=JOINT,
# joint_preset/:SEL/:GPU handled per its header comments; :GPU sets
# LMCACHE_JOINT_GPU_EVICT=1 (+ joint_gpu_preset when =NAME is given).
#
# ENABLE_ACCESS_LOG feeds the OFFLINE analysis only (belady_sim / oracle
# ceilings on exactly these workloads). The joint controller — all three
# decisions — never reads the access log; its signals arrive live via policy
# callbacks, the connector hook, and the joint-GPU shim (gated by
# LMCACHE_JOINT_GPU_EVICT, independent of LMCACHE_ACCESS_LOG). Set to 0 if
# disk pressure matters; controller behavior is unchanged either way.
# Client knobs match sweep_rung1.conf (seed 42, MAX_REQUESTS=400) for
# comparability; pool sizes match rung0_mp_m3 (20/30GB).
# =============================================================================

# ---- SWEEP DIMENSIONS ---------------------------------------------------------
POLICIES=(
    LRU
    JOINT:SIZE_AWARE
    JOINT:SIZE_AWARE:SEL
    JOINT:SIZE_AWARE:GPU=CPU_BACKED
    JOINT:SIZE_AWARE:SEL:GPU=CPU_BACKED
    JOINT:ADAPTIVE:SEL:GPU=CPU_BACKED
)
CPU_SIZES_GB=(20 30)

# ---- OUTPUT -----------------------------------------------------------------
ENABLE_ACCESS_LOG=1
BASE_OUTPUT_DIR="/workspace/vllm/logs/rung1c"
RUN_PREFIX=""

# ---- SERVER (vllm serve) — fixed across the sweep ---------------------------
MODEL="Qwen/Qwen2.5-7B-Instruct"
HOST="localhost"
PORT="8000"
HIP_VISIBLE_DEVICES="0"
GPU_MEM_UTIL="0.5"
MAX_MODEL_LEN="131072"
MAX_NUM_SEQS="24"
BLOCK_SIZE="16"
KV_CACHE_METRICS_SAMPLE="1.0"
LMCACHE_CHUNK_SIZE="256"
PROM_DIR="/tmp/lmcache_prometheus"
HF_OVERRIDES='{"rope_parameters": {"rope_type": "yarn", "factor": 4.0, "original_max_position_embeddings": 32768, "rope_theta": 1000000}}'
KV_TRANSFER_CONFIG='{"kv_connector":"LMCacheConnectorV1","kv_role":"kv_both"}'

# ---- CLIENT (trace_replay_tester.py) — fixed across the sweep ---------------
TRACE_DIR="./traces"
TOKENIZER="Qwen/Qwen2.5-7B-Instruct"
MAX_CONTEXT="64000"
CHUNK_SIZE="64"
MAX_CONCURRENT="24"
START_USERS="30"
MAX_USERS="50"
MAX_TRACES="64"
TEST_DURATION="3600"
MAX_REQUESTS="400"
TIMING_STRATEGY="think-only"
SEED="42"
MAX_TTFT="1000"

# ---- ORCHESTRATION TIMEOUTS / SAFETY (seconds) ------------------------------
SERVER_START_TIMEOUT="600"
SERVER_STOP_TIMEOUT="60"
SERVER_STOP_GRACE="30"
SERVER_SETTLE="20"
CLIENT_TIMEOUT_BUFFER="1800"
POLL_INTERVAL="3"
