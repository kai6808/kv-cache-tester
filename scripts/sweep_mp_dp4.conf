# =============================================================================
# sweep_mp_dp4.conf — configuration for scripts/run_sweep_mp.sh (Rung 0, MP+DP
# path), N=4 DP workers. Sibling of sweep_mp.conf (which produced the N=2
# results analyzed in sim/mp/results/rung0_mp_m3/SUMMARY.md) — same shared
# CPU pool + eviction-policy sweep, same client/trace settings, only
# DATA_PARALLEL_SIZE and HIP_VISIBLE_DEVICES change. Still MP+DP CPU-pool
# only — no SSD/L2 tier here (that's profile_tiers.conf's job, and is a
# separate short probe, not this kind of real data-collection sweep).
#
# Why this exists: rung0_mp_m3/SUMMARY.md line 6 and
# .claude/plans/2026-07-14-rung0-multiworker-headroom-gate.md line 48 both
# already call out "N=4 at the winning pool size" as the deferred next step
# ("amd-01 has 4 idle MI210s — N=2 now, N=4 later, both fit") — confirmed
# 2026-09-09 you still have 4 GPUs. The plan doc doesn't pin down a single
# "winning" pool size in what I read, and rung0_mp_m3 itself swept both
# 20GB/30GB, so this sweeps both again for direct N=2-vs-N=4 comparability.
# Tell me to drop one if you only want a single pool size for N=4.
#
# BASE_OUTPUT_DIR is a fresh tree (rung0_mp_dp4, not rung0_mp_m3) so this
# can't silently overwrite the N=2 results — same discipline sweep_mp.conf's
# own header comment used when it moved off the 1.3 sanity-sweep tree.
#
# Delta from sweep_mp.conf:
#   - DATA_PARALLEL_SIZE="4" (was "2")
#   - HIP_VISIBLE_DEVICES="0,1,2,3" (was "0,1") — confirmed 4 GPUs available
#   - BASE_OUTPUT_DIR points at a new tree
#   Everything else (ports, eviction policy, pool sizes, client settings,
#   TTLs) is unchanged from sweep_mp.conf.
# =============================================================================

# ---- SWEEP DIMENSIONS (the script loops over every policy x cpu_size) --------
# Valid MP eviction policies: LRU IsolatedLRU noop. Still LRU-only, same as
# sweep_mp.conf (QSLRU doesn't exist on the MP path yet).
EVICTION_POLICIES=(LRU)
# L1 pool size in GB (host RAM, shared across all 4 DP workers via the MP server).
CPU_SIZES_GB=(20 30)

# ---- OUTPUT -----------------------------------------------------------------
# Same convention as sweep_mp.conf: cpu_access.jsonl per process (CPU tier:
# store/hit/evict/offload/lookup/prefetch from the lmcache server; routing/
# scheduling/GPU admit/hit/evict from vLLM's API-server + all 4 DP workers).
ENABLE_ACCESS_LOG=1

# Fresh tree — do NOT point this at rung0_mp_m3 (that's the N=2 data this
# run is meant to be compared against, not overwritten).
BASE_OUTPUT_DIR="/workspace/vllm/logs/rung0_mp_dp4"
RUN_PREFIX=""

# ---- MP SERVER (`lmcache server`) — fixed across the sweep -------------------
MP_HOST="localhost"
MP_PORT="5555"                  # ZMQ port; vLLM's kv_connector_extra_config points here
MP_HTTP_HOST="0.0.0.0"
MP_HTTP_PORT="8080"             # /healthcheck, /status
MP_MAX_WORKERS="4"              # L2/executor thread-pool size — unrelated to DATA_PARALLEL_SIZE below, coincidentally also 4
MP_CHUNK_SIZE="256"
MP_MQ_TIMEOUT="10"              # seconds, vLLM-side lmcache.mp.mq_timeout
# TTLs disabled (very large, ~10y): default write=600s/read=300s would evict by
# age mid-sweep and pollute policy comparisons (found in 1.1 smoke test).
MP_L1_WRITE_TTL_SECONDS="315360000"
MP_L1_READ_TTL_SECONDS="315360000"

# ---- SERVER (vllm serve) — fixed across the sweep ---------------------------
MODEL="Qwen/Qwen2.5-7B-Instruct"
HOST="localhost"
PORT="8000"
DATA_PARALLEL_SIZE="4"
HIP_VISIBLE_DEVICES="0,1,2,3"   # must list DATA_PARALLEL_SIZE GPUs — confirmed 4 available 2026-09-09
GPU_MEM_UTIL="0.5"
MAX_MODEL_LEN="131072"
MAX_NUM_SEQS="24"
BLOCK_SIZE="16"
KV_CACHE_METRICS_SAMPLE="1.0"
HF_OVERRIDES='{"rope_parameters": {"rope_type": "yarn", "factor": 4.0, "original_max_position_embeddings": 32768, "rope_theta": 1000000}}'
KV_LOAD_FAILURE_POLICY="recompute"
PROM_DIR="/tmp/lmcache_prometheus_mp_dp4"

# ---- CLIENT (trace_replay_tester.py) — fixed across the sweep ---------------
# Same trace/duration/user settings as sweep_mp.conf so the N=2 vs N=4
# comparison isn't confounded by a different client config.
TRACE_DIR="./traces"
TOKENIZER="Qwen/Qwen2.5-7B-Instruct"
MAX_CONTEXT="64000"
CHUNK_SIZE="64"
MAX_CONCURRENT="24"
START_USERS="30"
MAX_USERS="50"
MAX_TRACES="64"
TEST_DURATION="3600"
MAX_REQUESTS=""
TIMING_STRATEGY="think-only"
SEED="42"
MAX_TTFT="1000"

# ---- ORCHESTRATION TIMEOUTS / SAFETY (seconds) ------------------------------
MP_SERVER_START_TIMEOUT="60"    # max wait for lmcache server /healthcheck
MP_SERVER_STOP_TIMEOUT="30"     # max wait for /healthcheck to stop after SIGINT
MP_SERVER_STOP_GRACE="15"       # SIGINT grace before SIGKILL of the mp server group
SERVER_START_TIMEOUT="600"      # max wait for vllm /health to come up; else skip run
SERVER_STOP_TIMEOUT="60"
SERVER_STOP_GRACE="30"
SERVER_SETTLE="20"
CLIENT_TIMEOUT_BUFFER="1800"
POLL_INTERVAL="3"
