# =============================================================================
# sweep_mp.conf — configuration for scripts/run_sweep_mp.sh (Rung 0, MP+DP path)
#
# Sourced by bash, same discipline as sweep.conf: EVICTION_POLICIES x CPU_SIZES_GB
# are the swept dimensions, and the run name + `lmcache server` flags + vLLM
# kv-transfer-config are all derived from the same loop variables so they can't
# drift apart.
#
# Delta from sweep.conf (see .claude/plans/2026-07-14-rung0-multiworker-headroom-gate.md):
#   - one `vllm serve --data-parallel-size N` + one standalone `lmcache server`
#     owning the shared CPU pool, instead of in-process LMCacheConnectorV1.
#   - policy is an `lmcache server --eviction-policy` value (LRU/IsolatedLRU/noop),
#     NOT a `cache_policy/` name — QSLRU does not exist on the MP path yet.
# =============================================================================

# ---- SWEEP DIMENSIONS (the script loops over every policy x cpu_size) --------
# Valid MP eviction policies: LRU IsolatedLRU noop. Rung 0 is LRU-only until the
# Milestone 2/3 MP logging + sim tooling lands.
EVICTION_POLICIES=(LRU)
# L1 pool size in GB (host RAM, shared across all DP workers via the MP server).
CPU_SIZES_GB=(20 30)

# ---- OUTPUT -----------------------------------------------------------------
# MP-path access logging does not exist yet (Milestone 2) — ENABLE_ACCESS_LOG is
# accepted for interface parity with sweep.conf but is currently a no-op.
ENABLE_ACCESS_LOG=0

BASE_OUTPUT_DIR="/workspace/vllm/logs/rung0_mp"
RUN_PREFIX=""

# ---- MP SERVER (`lmcache server`) — fixed across the sweep -------------------
MP_HOST="localhost"
MP_PORT="5555"                  # ZMQ port; vLLM's kv_connector_extra_config points here
MP_HTTP_HOST="0.0.0.0"
MP_HTTP_PORT="8080"             # /healthcheck, /status
MP_MAX_WORKERS="4"
MP_CHUNK_SIZE="256"
MP_MQ_TIMEOUT="10"              # seconds, vLLM-side lmcache.mp.mq_timeout
# TTLs disabled (very large, ~10y): default write=600s/read=300s would evict by
# age mid-sweep and pollute policy comparisons (found in 1.1 smoke test).
MP_L1_WRITE_TTL_SECONDS="315360000"
MP_L1_READ_TTL_SECONDS="315360000"

# ---- SERVER (vllm serve) — fixed across the sweep ---------------------------
MODEL="Qwen/Qwen2.5-7B-Instruct"
HOST="localhost"
PORT="8000"
DATA_PARALLEL_SIZE="2"
HIP_VISIBLE_DEVICES="0,1"       # must list DATA_PARALLEL_SIZE GPUs
GPU_MEM_UTIL="0.5"
MAX_MODEL_LEN="131072"
MAX_NUM_SEQS="24"
BLOCK_SIZE="16"
KV_CACHE_METRICS_SAMPLE="1.0"
HF_OVERRIDES='{"rope_parameters": {"rope_type": "yarn", "factor": 4.0, "original_max_position_embeddings": 32768, "rope_theta": 1000000}}'
KV_LOAD_FAILURE_POLICY="recompute"
PROM_DIR="/tmp/lmcache_prometheus_mp"

# ---- CLIENT (trace_replay_tester.py) — fixed across the sweep ---------------
TRACE_DIR="./traces"
TOKENIZER="Qwen/Qwen2.5-7B-Instruct"
MAX_CONTEXT="64000"
CHUNK_SIZE="64"
MAX_CONCURRENT="24"
START_USERS="30"
MAX_USERS="50"
MAX_TRACES="64"
TEST_DURATION="3600"
MAX_REQUESTS=""
TIMING_STRATEGY="think-only"
SEED="42"
MAX_TTFT="1000"

# ---- ORCHESTRATION TIMEOUTS / SAFETY (seconds) ------------------------------
MP_SERVER_START_TIMEOUT="60"    # max wait for lmcache server /healthcheck
MP_SERVER_STOP_TIMEOUT="30"     # max wait for /healthcheck to stop after SIGINT
MP_SERVER_STOP_GRACE="15"       # SIGINT grace before SIGKILL of the mp server group
SERVER_START_TIMEOUT="600"      # max wait for vllm /health to come up; else skip run
SERVER_STOP_TIMEOUT="60"
SERVER_STOP_GRACE="30"
SERVER_SETTLE="20"
CLIENT_TIMEOUT_BUFFER="1800"
POLL_INTERVAL="3"
