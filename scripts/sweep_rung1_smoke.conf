# =============================================================================
# sweep_rung1_smoke.conf — Rung 1 Stage A smoke test (NOT for results).
#
# Tiny 2-combo run (LRU + JOINT:LRU_EQUIV @ 20GB) proving the harness's
# JOINT:* plumbing end-to-end: server healthy under JOINT, no controller
# errors in the log, results directory materializes. A few minutes per combo.
# =============================================================================

# ---- SWEEP DIMENSIONS ---------------------------------------------------------
POLICIES=(LRU JOINT:LRU_EQUIV)
CPU_SIZES_GB=(20)

# ---- OUTPUT -----------------------------------------------------------------
ENABLE_ACCESS_LOG=1
BASE_OUTPUT_DIR="/workspace/vllm/logs/rung1_smoke"
RUN_PREFIX="smoke"

# ---- SERVER (vllm serve) — fixed across the sweep ---------------------------
MODEL="Qwen/Qwen2.5-7B-Instruct"
HOST="localhost"
PORT="8000"
HIP_VISIBLE_DEVICES="0"
GPU_MEM_UTIL="0.5"
MAX_MODEL_LEN="131072"
MAX_NUM_SEQS="24"
BLOCK_SIZE="16"
KV_CACHE_METRICS_SAMPLE="1.0"
LMCACHE_CHUNK_SIZE="256"
PROM_DIR="/tmp/lmcache_prometheus"
HF_OVERRIDES='{"rope_parameters": {"rope_type": "yarn", "factor": 4.0, "original_max_position_embeddings": 32768, "rope_theta": 1000000}}'
KV_TRANSFER_CONFIG='{"kv_connector":"LMCacheConnectorV1","kv_role":"kv_both"}'

# ---- CLIENT (trace_replay_tester.py) — small on purpose ----------------------
TRACE_DIR="./traces"
TOKENIZER="Qwen/Qwen2.5-7B-Instruct"
MAX_CONTEXT="64000"
CHUNK_SIZE="64"
MAX_CONCURRENT="8"
START_USERS="10"
MAX_USERS="10"
MAX_TRACES="4"
TEST_DURATION="180"
MAX_REQUESTS="30"
TIMING_STRATEGY="think-only"
SEED="42"
MAX_TTFT="1000"

# ---- ORCHESTRATION TIMEOUTS / SAFETY (seconds) ------------------------------
SERVER_START_TIMEOUT="600"
SERVER_STOP_TIMEOUT="60"
SERVER_STOP_GRACE="30"
SERVER_SETTLE="15"
CLIENT_TIMEOUT_BUFFER="300"
POLL_INTERVAL="3"
