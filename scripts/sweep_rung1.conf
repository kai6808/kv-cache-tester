# =============================================================================
# sweep_rung1.conf — Rung 1 FULL Stage A + Stage B sweep in one pass.
#
# Merges the former sweep_rung1.conf (Stage A, 7 combos), sweep_rung1_repeat.conf
# (the (a)/(g) variance repeats, now via the @rep2 marker) and sweep_rung1b.conf
# (Stage B selective offload, 4 combos): 13 entries x {20,30}GB = 26 runs, one
# output tree.
#
# Stage A combos (Rung 1 plan, Part 4 Step 3):
#   LRU               (a) baseline
#   QSLRU             (b) shipped queue-aware policy
#   JOINT:LRU_EQUIV   (c) regression gate — must match (a)
#   JOINT:QSLRU_LIKE  (d) composite reproduction of (b)
#   JOINT:LFU_LEAN    (e) frequency operating point
#   JOINT:SIZE_AWARE  (f) write-amp-oriented operating point
#   JOINT:ADAPTIVE    (g) closed-loop rule on
#   LRU@rep2 / JOINT:ADAPTIVE@rep2 — variance-bounding repeats of (a)/(g);
#     the @rep2 tag only prefixes the run name, the combo is byte-identical.
#
# Stage B combos (Stage B plan, pinned decision 8; the selective-OFF baselines
# are the Stage A runs above — same sweep, same tree, do not re-run):
#   JOINT:LRU_EQUIV:SEL   regression gate — must match JOINT:LRU_EQUIV
#   JOINT:SIZE_AWARE:SEL  write-amp attacker (size-weighted admission refusals)
#   JOINT:LFU_LEAN:SEL    frequency operating point + selective
#   JOINT:ADAPTIVE:SEL    closed-loop rule + selective
#
# JOINT:* combos are split by run_sweep.sh into LMCACHE_CACHE_POLICY=JOINT plus
# LMCACHE_EXTRA_CONFIG={"joint_preset":...}; ADAPTIVE adds joint_adapt_enabled,
# a trailing :SEL adds joint_selective_offload.
# Client knobs match the agentic_jul5_req400 baseline sweep (MAX_REQUESTS=400,
# seed 42) so results are comparable; pool sizes match rung0_mp_m3 (20/30GB).
# ENABLE_ACCESS_LOG=1 feeds the OFFLINE analysis only (belady_sim / oracle
# ceilings computed on exactly these workloads) — the joint controller never
# reads the access log; its signals arrive live via the policy callbacks.
# =============================================================================

# ---- SWEEP DIMENSIONS ---------------------------------------------------------
POLICIES=(
    # Stage A
    LRU QSLRU JOINT:LRU_EQUIV JOINT:QSLRU_LIKE JOINT:LFU_LEAN JOINT:SIZE_AWARE JOINT:ADAPTIVE
    # Stage A variance repeats
    LRU@rep2 JOINT:ADAPTIVE@rep2
    # Stage B (selective offload)
    JOINT:LRU_EQUIV:SEL JOINT:SIZE_AWARE:SEL JOINT:LFU_LEAN:SEL JOINT:ADAPTIVE:SEL
)
CPU_SIZES_GB=(20 30)

# ---- OUTPUT -----------------------------------------------------------------
ENABLE_ACCESS_LOG=1
BASE_OUTPUT_DIR="/workspace/vllm/logs/rung1"
RUN_PREFIX=""

# ---- SERVER (vllm serve) — fixed across the sweep ---------------------------
MODEL="Qwen/Qwen2.5-7B-Instruct"
HOST="localhost"
PORT="8000"
HIP_VISIBLE_DEVICES="0"
GPU_MEM_UTIL="0.5"
MAX_MODEL_LEN="131072"
MAX_NUM_SEQS="24"
BLOCK_SIZE="16"
KV_CACHE_METRICS_SAMPLE="1.0"
LMCACHE_CHUNK_SIZE="256"
PROM_DIR="/tmp/lmcache_prometheus"
HF_OVERRIDES='{"rope_parameters": {"rope_type": "yarn", "factor": 4.0, "original_max_position_embeddings": 32768, "rope_theta": 1000000}}'
KV_TRANSFER_CONFIG='{"kv_connector":"LMCacheConnectorV1","kv_role":"kv_both"}'

# ---- CLIENT (trace_replay_tester.py) — fixed across the sweep ---------------
TRACE_DIR="./traces"
TOKENIZER="Qwen/Qwen2.5-7B-Instruct"
MAX_CONTEXT="64000"
CHUNK_SIZE="64"
MAX_CONCURRENT="24"
START_USERS="30"
MAX_USERS="50"
MAX_TRACES="64"
TEST_DURATION="3600"
MAX_REQUESTS="400"
TIMING_STRATEGY="think-only"
SEED="42"
MAX_TTFT="1000"

# ---- ORCHESTRATION TIMEOUTS / SAFETY (seconds) ------------------------------
SERVER_START_TIMEOUT="600"
SERVER_STOP_TIMEOUT="60"
SERVER_STOP_GRACE="30"
SERVER_SETTLE="20"
CLIENT_TIMEOUT_BUFFER="1800"
POLL_INTERVAL="3"
